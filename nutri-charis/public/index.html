<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="description" content="NutriCharis — κλινικό διαιτολογικό γραφείο Χάρις Φωτούδη" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NutriCharis" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>NutriCharis</title>
    <style>
      #initial-loader {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #022c22;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #34d399;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        z-index: 99999;
        transition: opacity 0.3s ease;
      }
      .loader-spinner {
        width: 36px; height: 36px;
        border: 3px solid rgba(16, 185, 129, 0.2);
        border-top-color: #34d399;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .loader-spinner { animation: none; }
        #initial-loader { transition: none; }
      }
    </style>
  </head>
  <body>
    <noscript>Ενεργοποιήστε τη JavaScript για να χρησιμοποιήσετε το NutriCharis.</noscript>
    <div id="initial-loader">
      <div class="loader-spinner"></div>
      <div style="font-weight: 700; font-size: 14px; letter-spacing: 0.5px; color: #ffffff;">NutriCharis</div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 300);
          }
        }, 300);
      });
    </script>
  </body>
</html>
